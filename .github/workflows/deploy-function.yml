name: Deploy Function to Cloud Run Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "function/**"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  FUNCTION_NAME: ingest-homepage-videos
  ENTRY_POINT: ingestVideos
  CLOUD_SQL_INSTANCE: ${{ secrets.CLOUD_SQL_INSTANCE }}
  SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: Build and Deploy Function
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install dependencies and build
        working-directory: function
        run: |
          npm ci
          npm run build

      - name: Debug - Check build permissions
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format="value(projectNumber)")
          echo "=== Project Info ==="
          echo "PROJECT_ID: ${{ env.PROJECT_ID }}"
          echo "PROJECT_NUMBER: ${PROJECT_NUMBER}"
          echo ""

          echo "=== Cloud Build Service Agent ==="
          BUILD_SA="service-${PROJECT_NUMBER}@gcp-sa-cloudbuild.iam.gserviceaccount.com"
          echo "Build SA: ${BUILD_SA}"
          gcloud projects get-iam-policy ${{ env.PROJECT_ID }} \
            --flatten="bindings[].members" \
            --filter="bindings.members:${BUILD_SA}" \
            --format="table(bindings.role)" 2>&1 || echo "Could not get IAM for build SA"
          echo ""

          echo "=== Default Compute SA ==="
          COMPUTE_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          echo "Compute SA: ${COMPUTE_SA}"
          gcloud projects get-iam-policy ${{ env.PROJECT_ID }} \
            --flatten="bindings[].members" \
            --filter="bindings.members:${COMPUTE_SA}" \
            --format="table(bindings.role)" 2>&1 || echo "Could not get IAM for compute SA"
          echo ""

          echo "=== Function Build Config (if exists) ==="
          gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="yaml(buildConfig)" 2>&1 || echo "Function does not exist yet"
          echo ""

          echo "=== Cloud Build Recent Builds ==="
          gcloud builds list \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --limit=3 \
            --format="table(id, status, serviceAccount)" 2>&1 || echo "Could not list builds"
          echo ""

          echo "=== Org Policies (if any) ==="
          gcloud org-policies list --project=${{ env.PROJECT_ID }} \
            --filter="constraint:cloudbuild OR constraint:iam" \
            --format="table(constraint, listPolicy, booleanPolicy)" 2>&1 || echo "Could not list org policies"
          echo ""

          echo "=== Artifact Registry Repos ==="
          gcloud artifacts repositories list \
            --project=${{ env.PROJECT_ID }} \
            --location=${{ env.REGION }} \
            --format="table(name, format)" 2>&1 || echo "Could not list repos"

      - name: Deploy to Cloud Run Function
        working-directory: function
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --region=${{ env.REGION }} \
            --runtime=nodejs22 \
            --source=. \
            --entry-point=${{ env.ENTRY_POINT }} \
            --trigger-http \
            --allow-unauthenticated \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --build-service-account=projects/${{ env.PROJECT_ID }}/serviceAccounts/${{ env.SERVICE_ACCOUNT }} \
            --set-env-vars="DB_HOST=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }},DB_PORT=5432,DB_NAME=nbc_videos" \
            --set-secrets="DB_USERNAME=db-username:latest,DB_PASSWORD=db-password:latest,SCRAPERAPI_KEY=scraperapi-key:latest" \
            --project=${{ env.PROJECT_ID }} \
            --quiet

      - name: Attach Cloud SQL instance
        run: |
          gcloud run services update ${{ env.FUNCTION_NAME }} \
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --quiet

      - name: Output function URL
        run: |
          FUNCTION_URL=$(gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(serviceConfig.uri)")
          echo "### Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Function:** ${{ env.FUNCTION_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${FUNCTION_URL}" >> "$GITHUB_STEP_SUMMARY"
